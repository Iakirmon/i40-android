name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalacja platformy 34
        run: sdkmanager "platforms;android-34"
      - name: ktlint, lint, test
        run: ./gradlew ktlintCheck lint test --stacktrace
